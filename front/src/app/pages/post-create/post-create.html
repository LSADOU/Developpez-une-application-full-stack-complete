<h1>Créer un article</h1>
<input type="text" placeholder="Titre" [(ngModel)]="title">
<select [(ngModel)]="topicId">
  <option *ngFor="let topic of availableTopics" [value]="topic.id">{{ topic.title }}</option>
</select>
<textarea placeholder="Contenu de l'article" [(ngModel)]="content"></textarea>
<button (click)="onCreatePost()">Créer l'article</button>
