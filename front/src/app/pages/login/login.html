<button class="back-btn" mat-icon-button routerLink="/">
  <mat-icon>arrow_back</mat-icon>
</button>
<h1 class="page-title">Connexion</h1>
<form [formGroup]="loginForm" (ngSubmit)="onLogin()">
  <mat-form-field appearance="outline">
    <mat-label>Nom d'utilisateur ou email</mat-label>
    <input matInput formControlName="identifier">
    <mat-error *ngIf="loginForm.get('identifier')?.hasError('required')">Champs requis</mat-error>
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Mot de passe</mat-label>
    <input matInput type="password" formControlName="password">
    <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Champs requis</mat-error>
  </mat-form-field>
  <button mat-raised-button class="btn-primary" type="submit" [disabled]="loginForm.invalid">Se connecter</button>
  <p *ngIf="errorAuth">{{ errorAuth }}</p>
</form>
