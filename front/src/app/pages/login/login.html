<h1>Connexion</h1>
<button routerLink="/">&larr;</button> 
<form [formGroup]="loginForm" (ngSubmit)="onLogin()">
  <mat-form-field appearance="outline">
    <mat-label>Nom d'utilisateur ou email</mat-label><input matInput formControlName="identifier">
    <mat-error *ngIf="loginForm.get('identifier')?.hasError('required')">Champs requis</mat-error>
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Mot de passe</mat-label><input matInput formControlName="password">
    <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Champs requis</mat-error>
  </mat-form-field>
  <button mat-raised-button type="submit" [disabled]="loginForm.invalid">Se connecter</button>
</form>
