<h2>{{ theme.title }}</h2>
<p>{{ theme.description }}</p>
<button *ngIf="!isUserSubscribed" (click)="manageSubscription()">S'abonner</button>
<button *ngIf="isUserSubscribed && CanUserUnsubscribe" (click)="manageSubscription()">Se désabonner</button>
<button *ngIf="isUserSubscribed && !CanUserUnsubscribe" disabled>Déjà abonné</button>
