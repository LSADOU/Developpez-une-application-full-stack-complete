<nav class="header" *ngIf="!isHomePage || isAuthenticated">
  <img class="header__logo" src="assets/logo_p6.png" alt="Logo MDD" *ngIf="showLogo">
  <div class="header__nav-desktop" *ngIf="isAuthenticated">
    <button mat-button style="color: var(--red-mdd); font-weight: bold" (click)="toLogout()">Se déconnecter</button>
    <button mat-button style="color: var(--violet-mdd)" routerLink="/posts">Articles</button>
    <button mat-button style="color: #000" routerLink="/topics">Thèmes</button>
    <button mat-icon-button routerLink="/profile"><mat-icon>account_circle</mat-icon></button>
  </div>
  <button mat-icon-button class="header__hamburger" *ngIf="isAuthenticated" (click)="toggleMenu()">
    <mat-icon>menu</mat-icon>
  </button>
</nav>
<div class="header__backdrop" *ngIf="menuOpen && isAuthenticated" (click)="toggleMenu()"></div>
<div class="header__mobile-menu" *ngIf="menuOpen && isAuthenticated">
  <div class="header__mobile-menu__nav">
    <button mat-button style="color: var(--red-mdd); font-weight: bold" (click)="toLogout()">Se déconnecter</button>
    <button mat-button routerLink="/posts" (click)="toggleMenu()">Articles</button>
    <button mat-button routerLink="/topics" (click)="toggleMenu()">Thèmes</button>
  </div>
  <div class="header__mobile-menu__actions">
    <button mat-button routerLink="/profile" (click)="toggleMenu()">
      <mat-icon>account_circle</mat-icon> Profil
    </button>
  </div>
</div>
